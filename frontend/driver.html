<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideNow - Driver</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <nav class="navbar">
        <h2 class="logo-text">Ride<span>Now</span> Driver</h2>
        <div class="user-info">
            <a href="driver-my-rides.html" class="nav-link" style="margin-right: 15px;">My Rides</a>
            <a href="driver-stats.html" class="nav-link" style="margin-right: 15px;">My Stats</a>
            
            <div style="position: relative;">
                <img id="userAvatar" src="https://ui-avatars.com/api/?name=Driver&background=00c853&color=fff&rounded=true" style="width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-color);">
            </div>
            
            <span id="driverName">Loading...</span>
            <button id="logoutBtn" class="btn-logout">Logout</button>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="welcome-card">
            <h3>Available Ride Requests</h3>
            <p>Accept a ride to start earning.</p>
        </div>

        <div id="ridesList" class="rides-list">
            <p style="text-align: center; color: #777;">Loading available rides...</p>
        </div>
    </div>

    <script type="module" src="js/driver.js"></script>
</body>
</html>
