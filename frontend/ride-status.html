<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideNow - Live Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .tracking-container { width: 90%; max-width: 800px; margin: 20px auto; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        #map { height: 400px; width: 100%; }
        .status-info { padding: 20px; }
        .status-badge { display: inline-block; padding: 5px 12px; border-radius: 20px; background: #e8f5e9; color: #2e7d32; font-weight: bold; margin-bottom: 10px; }
        .driver-info { display: flex; align-items: center; gap: 15px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
        .driver-avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--primary-color); color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h2 class="logo-text">Ride<span>Now</span></h2>
        <div class="user-info">
            <a href="passenger.html" class="nav-link">Back to Dashboard</a>
        </div>
    </nav>

    <div class="tracking-container">
        <div id="map"></div>
        <div class="status-info">
            <div class="status-badge" id="statusBadge">Searching...</div>
            <h3 id="routeText">Loading route...</h3>
            <p style="color: #666; font-size: 14px;" id="fareText">Fare: Rs. 0</p>
            
            <div class="driver-info" id="driverInfo" style="display: none;">
                <div class="driver-avatar" id="driverAvatar">R</div>
                <div>
                    <h4 id="driverNameText" style="margin: 0;">Rider Name</h4>
                    <p style="margin: 0; font-size: 13px; color: #666;" id="driverRatingText">⭐ New Rider</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="js/ride-status.js"></script>
</body>
</html>
