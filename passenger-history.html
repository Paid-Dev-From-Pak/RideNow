<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideNow - My History</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <nav class="navbar">
        <h2 class="logo-text">Ride<span>Now</span></h2>
        <div class="user-info">
            <a href="passenger.html" class="nav-link" style="margin-right: 15px;">Book Ride</a>
            <span id="userName">Loading...</span>
            <button id="logoutBtn" class="btn-logout">Logout</button>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="welcome-card">
            <h3>Your Ride History</h3>
            <p>All your past and active bike rides.</p>
        </div>

        <div id="historyList" class="rides-list">
            <p style="text-align: center; color: #777;">Loading history...</p>
        </div>
    </div>

    <script type="module" src="js/passenger-history.js"></script>
</body>
</html>
